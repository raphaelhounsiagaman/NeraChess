[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnue-training"
version = "0.1.0"
description = "Training pipeline for the NeraChess NNUE evaluation network"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "Raphael Hounsiagaman" }]

# Deliberately empty. Reading, writing, and verifying a network needs only the
# standard library, which keeps the format testable in CI without a heavyweight
# install. Training needs the extras below.
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
  # Optional for PyTorch, but its absence produces a warning on every import
  # that reads like a failure.
  "numpy>=1.24",
]
dev = [
  "torch>=2.2",
  "numpy>=1.24",
  "ruff>=0.5",
]

[project.scripts]
nnue-train = "nnue_training.train:main"
nnue-verify = "nnue_training.verify:main"

[tool.setuptools.packages.find]
include = ["nnue_training*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
