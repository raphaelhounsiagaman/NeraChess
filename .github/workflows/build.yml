name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-headless:
    name: Linux Headless + Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate Makefiles
        run: bash ./scripts/Setup-Linux.sh gmake

      - name: Check that headers are self-contained
        run: |
          # A header that leans on another one's includes compiles on libc++ and
          # fails on MSVC, which is a slow way to find out. Compiling each in
          # isolation catches it here instead.
          status=0
          # The headless set only. NeraChessApp needs SDL headers this job does
          # not install, and it is not built here.
          for header in $(find NeraChessEngine/src NeraChessNNUE/src NeraChessSearch/src \
                               NeraChessUCI/src -name '*.h' | sort); do
            printf '#include "%s"\nint main(){return 0;}\n' "$(basename "$header")" > /tmp/self_contained.cpp
            if ! g++ -std=c++23 -fsyntax-only \
                -I NeraChessEngine/src -I NeraChessNNUE/src \
                -I NeraChessSearch/src -I NeraChessUCI/src \
                /tmp/self_contained.cpp 2>/tmp/self_contained.log; then
              echo "::error file=$header::$header does not compile on its own"
              head -5 /tmp/self_contained.log
              status=1
            fi
          done
          exit $status

      - name: Build headless Debug and Release
        run: |
          jobs="$(nproc)"
          make -C NeraChessEngine config=debug -j"$jobs"
          make -C NeraChessNNUE config=debug -j"$jobs"
          make -C NeraChessSearch config=debug -j"$jobs"
          make -C NeraChessUCI config=debug -j"$jobs"
          make -C NeraChessTests config=debug -j"$jobs"
          make -C NeraChessEngine config=release -j"$jobs"
          make -C NeraChessNNUE config=release -j"$jobs"
          make -C NeraChessSearch config=release -j"$jobs"
          make -C NeraChessUCI config=release -j"$jobs"
          make -C NeraChessTests config=release -j"$jobs"

      - name: Run release regressions and UCI smoke test
        run: |
          # --eval-file loads the network that actually ships, so the
          # strategic and tactical choice tests run instead of skipping
          # themselves. Without it they are dead in every CI run.
          ./bin/Release/NeraChessTests/NeraChessTests \
            --eval-file NeraChessApp/Resources/NNUE/nera.nnue
          uci_output="$(printf 'uci\nisready\nposition startpos\ngo depth 3 wtime 60000 btime 60000 winc 1000 binc 1000 movestogo 30\n' | ./bin/Release/NeraChessUCI/NeraChessUCI)"
          printf '%s\n' "$uci_output"
          grep -q '^uciok$' <<< "$uci_output"
          grep -q '^readyok$' <<< "$uci_output"
          grep -q '^bestmove e2e4$' <<< "$uci_output"
          python3 scripts/Test-UciPonder.py ./bin/Release/NeraChessUCI/NeraChessUCI

      - name: Run NNUE training tests
        run: |
          cd NNUETraining
          python3 -m unittest discover -s tests -t .

      - name: Verify the engine and trainer agree on a network
        run: |
          cd NNUETraining
          python3 scripts/make_random_network.py --output "${RUNNER_TEMP}/random.nnue"
          python3 -m nnue_training.verify \
            --network "${RUNNER_TEMP}/random.nnue" \
            --engine ../bin/Release/NeraChessUCI/NeraChessUCI

      - name: Build and test the AVX2 NNUE kernels
        run: |
          if ! grep -q avx2 /proc/cpuinfo; then
            echo "This runner has no AVX2; the default build uses the SSE2 kernels."
            exit 0
          fi
          jobs="$(nproc)"
          # The default x86 build selects SSE2, so the AVX2 kernels are only
          # exercised by a build that asks for them. TestNnueSimdKernels checks
          # them against the scalar reference.
          make -C NeraChessEngine config=release -B -j"$jobs" CXXFLAGS="-mavx2"
          make -C NeraChessNNUE config=release -B -j"$jobs" CXXFLAGS="-mavx2"
          make -C NeraChessSearch config=release -B -j"$jobs" CXXFLAGS="-mavx2"
          make -C NeraChessTests config=release -B -j"$jobs" CXXFLAGS="-mavx2"
          ./bin/Release/NeraChessTests/NeraChessTests \
            --eval-file NeraChessApp/Resources/NNUE/nera.nnue

      - name: Build and run sanitized regressions
        run: |
          jobs="$(nproc)"
          sanitizer_flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
          make -C NeraChessEngine config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessNNUE config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessSearch config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessTests config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags" LDFLAGS='-fsanitize=address,undefined'
          ./bin/Debug/NeraChessTests/NeraChessTests

      - name: Build and run thread-sanitized regressions
        run: |
          jobs="$(nproc)"
          sanitizer_flags='-fsanitize=thread -fno-omit-frame-pointer -O1 -g'
          make -C NeraChessEngine config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessNNUE config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessSearch config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessUCI config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags" LDFLAGS='-fsanitize=thread'
          make -C NeraChessTests config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags" LDFLAGS='-fsanitize=thread'
          TSAN_OPTIONS='halt_on_error=1 second_deadlock_stack=1' ./bin/Debug/NeraChessTests/NeraChessTests
          TSAN_OPTIONS='halt_on_error=1 second_deadlock_stack=1' python3 scripts/Test-UciPonder.py ./bin/Debug/NeraChessUCI/NeraChessUCI

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install premake sdl2-compat sdl2_image sdl2_mixer

      - name: Make llvm-ar available for LTO archiving
        # Premake's gmake action switches the archiver to llvm-ar for the
        # clang toolset once linktimeoptimization is enabled. Xcode ships
        # llvm-ar alongside clang in its toolchain directory, but only
        # `clang`/`ar`/`ranlib` are symlinked onto the default PATH.
        run: echo "$(dirname "$(xcrun --find clang)")" >> "$GITHUB_PATH"

      - name: Generate Makefiles
        run: ./scripts/Setup-macOS.sh gmake

      - name: Build Debug and Release
        run: |
          make config=debug -j"$(sysctl -n hw.logicalcpu)"
          make config=release -j"$(sysctl -n hw.logicalcpu)"

      - name: Run smoke test
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          ./bin/Release/NeraChessApp/NeraChessApp --smoke-test
          ./bin/Release/NeraChessApp/NeraChessApp --clock-smoke-test

      - name: Run engine regression tests
        run: |
          ./bin/Release/NeraChessTests/NeraChessTests \
            --eval-file NeraChessApp/Resources/NNUE/nera.nnue

      - name: Run UCI protocol smoke test
        run: |
          uci_output="$(printf 'uci\nisready\nposition startpos\ngo depth 3 wtime 60000 btime 60000 winc 1000 binc 1000 movestogo 30\n' | ./bin/Release/NeraChessUCI/NeraChessUCI)"
          printf '%s\n' "$uci_output"
          grep -q '^uciok$' <<< "$uci_output"
          grep -q '^readyok$' <<< "$uci_output"
          grep -q '^bestmove e2e4$' <<< "$uci_output"
          python3 scripts/Test-UciPonder.py ./bin/Release/NeraChessUCI/NeraChessUCI

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Generate Visual Studio solution
        shell: cmd
        run: scripts\Setup-Windows.bat vs2022

      - name: Build Debug and Release
        shell: cmd
        run: |
          msbuild NeraChess.sln /m /p:Configuration=Debug /p:Platform=x64
          msbuild NeraChess.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Run smoke test
        shell: cmd
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          bin\Release\NeraChessApp\NeraChessApp.exe --smoke-test
          bin\Release\NeraChessApp\NeraChessApp.exe --clock-smoke-test

      - name: Run engine regression tests
        shell: cmd
        run: bin\Release\NeraChessTests\NeraChessTests.exe

      - name: Run UCI protocol smoke test
        shell: pwsh
        run: |
          $output = @("uci", "isready", "position startpos", "go depth 3 wtime 60000 btime 60000 winc 1000 binc 1000 movestogo 30") |
            & bin\Release\NeraChessUCI\NeraChessUCI.exe
          $output | Write-Output
          if ($output -notcontains "uciok") { throw "UCI handshake failed" }
          if ($output -notcontains "readyok") { throw "UCI readiness failed" }
          if ($output -notcontains "bestmove e2e4") { throw "UCI opening-book lookup failed" }
          python scripts/Test-UciPonder.py bin\Release\NeraChessUCI\NeraChessUCI.exe
