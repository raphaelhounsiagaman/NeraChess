name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-headless:
    name: Linux Headless + Sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate Makefiles
        run: bash ./scripts/Setup-Linux.sh gmake

      - name: Build headless Debug and Release
        run: |
          jobs="$(nproc)"
          make -C NeraChessEngine config=debug -j"$jobs"
          make -C NeraChessSearch config=debug -j"$jobs"
          make -C NeraChessUCI config=debug -j"$jobs"
          make -C NeraChessTests config=debug -j"$jobs"
          make -C NeraChessEngine config=release -j"$jobs"
          make -C NeraChessSearch config=release -j"$jobs"
          make -C NeraChessUCI config=release -j"$jobs"
          make -C NeraChessTests config=release -j"$jobs"

      - name: Run release regressions and UCI smoke test
        run: |
          ./bin/Release/NeraChessTests/NeraChessTests
          uci_output="$(printf 'uci\nisready\nposition startpos\ngo depth 1\n' | ./bin/Release/NeraChessUCI/NeraChessUCI)"
          printf '%s\n' "$uci_output"
          grep -q '^uciok$' <<< "$uci_output"
          grep -q '^readyok$' <<< "$uci_output"
          grep -q '^bestmove ' <<< "$uci_output"

      - name: Build and run sanitized regressions
        run: |
          jobs="$(nproc)"
          sanitizer_flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
          make -C NeraChessEngine config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessSearch config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags"
          make -C NeraChessTests config=debug -B -j"$jobs" CXXFLAGS="$sanitizer_flags" LDFLAGS='-fsanitize=address,undefined'
          ./bin/Debug/NeraChessTests/NeraChessTests

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install premake sdl2-compat sdl2_image sdl2_mixer

      - name: Generate Makefiles
        run: ./scripts/Setup-macOS.sh gmake

      - name: Build Debug and Release
        run: |
          make config=debug -j"$(sysctl -n hw.logicalcpu)"
          make config=release -j"$(sysctl -n hw.logicalcpu)"

      - name: Run smoke test
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: ./bin/Release/NeraChessApp/NeraChessApp --smoke-test

      - name: Run engine regression tests
        run: ./bin/Release/NeraChessTests/NeraChessTests

      - name: Run UCI protocol smoke test
        run: |
          uci_output="$(printf 'uci\nisready\nposition startpos\ngo depth 1\n' | ./bin/Release/NeraChessUCI/NeraChessUCI)"
          printf '%s\n' "$uci_output"
          grep -q '^uciok$' <<< "$uci_output"
          grep -q '^readyok$' <<< "$uci_output"
          grep -q '^bestmove ' <<< "$uci_output"

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Generate Visual Studio solution
        shell: cmd
        run: scripts\Setup-Windows.bat vs2022

      - name: Build Debug and Release
        shell: cmd
        run: |
          msbuild NeraChess.sln /m /p:Configuration=Debug /p:Platform=x64
          msbuild NeraChess.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Run smoke test
        shell: cmd
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: bin\Release\NeraChessApp\NeraChessApp.exe --smoke-test

      - name: Run engine regression tests
        shell: cmd
        run: bin\Release\NeraChessTests\NeraChessTests.exe

      - name: Run UCI protocol smoke test
        shell: pwsh
        run: |
          $output = @("uci", "isready", "position startpos", "go depth 1") |
            & bin\Release\NeraChessUCI\NeraChessUCI.exe
          $output | Write-Output
          if ($output -notcontains "uciok") { throw "UCI handshake failed" }
          if ($output -notcontains "readyok") { throw "UCI readiness failed" }
          if (-not ($output -match "^bestmove ")) { throw "UCI search failed" }
